# Install the shared environment on the public CUDA image; a prebuilt image is optional.
pod:
  imageName: nvidia/cuda:12.8.0-cudnn-devel-ubuntu22.04
  cloudType: SECURE
  computeType: GPU
  gpuTypeIds: [NVIDIA H100 80GB HBM3]
  gpuCount: 1
  allowedCudaVersions: ["12.8", "12.9", "13.0"]
  minVCPUPerGPU: 16
  minRAMPerGPU: 180
  containerDiskInGb: 100
  volumeInGb: 100
  volumeMountPath: /workspace
  supportPublicIp: true
  ports: [22/tcp]
  interruptible: false

bootstrap: true

api_url: https://rest.runpod.io/v1

api_timeout_seconds: 30

api_retry_attempts: 3

ssh_keepalive_interval_seconds: 30

ssh_keepalive_count_max: 3

startup_timeout_seconds: 900

snapshot_timeout_seconds: 900

poll_interval_seconds: 5
