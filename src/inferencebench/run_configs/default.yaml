task:
  task: inferencebench/inference_bench
  args:
    config_defaults: default
    gpu_provider: modal
    gpu_config: null
    # null runs A–D; use A or [A, C] to select scenarios.
    scenarios: A
    # [development, evaluation] seeds; one pair instead of three reduces repeat runs.
    seed_pairs: [[21, 1337]]
    base_model: mistralai/Mistral-7B-Instruct-v0.3
    max_model_len: 32768
    # Precision of the Transformers speed baseline and the reference server; use bfloat16 for bf16-native models.
    baseline_dtype: float16
    # Optimizing agent's context window; null uses Inspect's model metadata.
    context_length: null
    agent_seconds: null
    system_prompt: token_budget
    # Leaderboard strict rules: no third-party pre-quantized checkpoints, no harness edits.
    strict_prompt: true
    # Require an automated search tool during hyperparameter tuning.
    automated_tuning: false
    request_limit: 10
    quality_samples: 500
    quality_seed: 248
    # The original Transformers server, measured once per model and GPU and shared from run-artifacts/baselines/; vllm measures in minutes but scores a few questions higher.
    quality_reference_backend: transformers
    quality_tau: 0.95
    quality_concurrency: 4
    quality_baseline_max_attempts: 2
    server_wait_seconds: 900
    request_timeout_seconds: 300
    scorer:
      name: inferencebench.scorers.inference_speedup
      args:
        grader_role: integrity
        judge_prompt: original_judge
        # Re-run the judge when its verdict files are missing or malformed.
        max_grader_attempts: 3
        include_transcript: true
        # One prompt line points the judge at the exported transcript.
        transcript_hint: true
        # Claude Code, run in the submission directory like upstream's judge; the port's tested pin.
        judge_cli_version: 2.1.114

solver:
  # Select react or an Inspect SWE CLI without adding another run-config file.
  solver: inferencebench/default_agent
  args:
    harness: react
    harness_args: null
    # Used by the CLI harnesses; native CLI options belong in harness_args.
    cli_poll_timeout: 7200
    tools: [bash, python, web_search]
    web_search_args:
      backend: duckduckgo
      max_results: 10
      timeout: 5
    # Shell and Python calls end after two hours; model API timeouts do not bound tool execution.
    tool_timeout: 7200
    compaction_threshold: 0.75
    # Submission and early-answer stopping are disabled by default.
    submit: false
    nudge_prompt: true
    token_budget_reminder: true

generate_config:
  temperature: null
  max_tokens: null
  seed: null
  reasoning_effort: null
  max_retries: 10
  attempt_timeout: 900

model_roles:
  integrity:
    model: openrouter/openai/gpt-6-astra
    args:
      # Claude Code's bridged tool schemas have optional parameters.
      strict_tools: false
    config:
      temperature: null
      max_tokens: null
      reasoning_effort: low
      max_retries: 10
      attempt_timeout: 900

eval_config:
  limit: null
  # Repeats each scenario–seed sample; 1 avoids additional runs.
  epochs: 1
  epochs_reducer: [inferencebench/complete_mean]
  # Total input-plus-output tokens per sample, including cached input.
  token_limit: 100000000
  time_limit: null
  max_samples: 1
