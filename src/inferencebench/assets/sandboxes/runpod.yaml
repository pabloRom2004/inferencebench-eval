# Fetch the public CUDA image from NVIDIA to avoid Docker Hub anonymous pull limits.
# CUDA 12.8.0, cuDNN, Ubuntu 22.04; identical digest to the Docker Hub image.
pod:
  imageName: nvcr.io/nvidia/cuda@sha256:c900a2ac7f3d860c854f7364eadfe32b8cd33933a838f96b71e9bb6525f77a8c
  cloudType: SECURE
  computeType: GPU
  gpuTypeIds: [NVIDIA H100 80GB HBM3]
  gpuCount: 1
  allowedCudaVersions: ["12.8", "12.9", "13.0"]
  minVCPUPerGPU: 16
  minRAMPerGPU: 180
  containerDiskInGb: 100
  volumeInGb: 100
  volumeMountPath: /workspace
  supportPublicIp: true
  ports: [22/tcp]
  interruptible: false

bootstrap: true

api_url: https://rest.runpod.io/v1

api_timeout_seconds: 30

# Bounds idempotent API requests and SSH connection establishment.
api_retry_attempts: 3

# Pod creation waits out RunPod capacity shortfalls, which its API reports as 5xx responses.
create_retry_attempts: 120

create_retry_interval_seconds: 30

ssh_keepalive_interval_seconds: 30

ssh_keepalive_count_max: 3

# Covers initial installation and restoring the filesystem after the scoring restart.
startup_timeout_seconds: 7200

# Saving an installed environment can take longer on a slow attached volume.
snapshot_timeout_seconds: 7200

poll_interval_seconds: 5
