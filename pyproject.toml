[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencebench"
version = "0.1.0"
description = "InferenceBench for Inspect AI, with CLI and ReAct agents on Modal or RunPod H100"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "asyncssh>=2.24.0",
    "ddgs>=9.16.0",
    "fsspec>=2023.1.0",
    "httpx>=0.28.1",
    "inspect-ai==0.3.265",
    "inspect-sandboxes==0.5.0",
    "inspect-swe @ git+https://github.com/meridianlabs-ai/inspect_swe.git@9a6e92b614fc224b157d7a7bed8df175ea13f7d4",
    "modal==1.5.5",
    "openai>=3.10.0",
    "pyyaml>=6",
]

[project.entry-points.inspect_ai]
inferencebench = "inferencebench"

[tool.setuptools.packages.find]
where = ["src"]
include = ["inferencebench*"]

[tool.setuptools.package-data]
inferencebench = [
    "run_configs/*.yaml",
    "assets/licenses/*",
    "assets/prompts/*.txt",
    "assets/scripts/*.py",
    "assets/scripts/*.sh",
    "assets/sandboxes/compose.yaml", "assets/sandboxes/runpod.yaml", "Dockerfile", "eval.yaml",
    "upstream.lock", "patches/*.patch",
    "upstream/**/*", "upstream/.gitignore", "upstream/containers/other_home_data/.codex/*",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "build"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# The vendored upstream copy stays byte-identical to its commit.
extend-exclude = ["src/inferencebench/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
