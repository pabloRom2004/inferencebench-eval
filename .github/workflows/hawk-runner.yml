name: Publish Hawk RunPod runner
on:
  push:
    branches: [codex/standardize-harnesses-hawk]
    paths: [infra/hawk-runner/**, .github/workflows/hawk-runner.yml]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: infra/hawk-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pablorom2004/inferencebench-hawk-runner:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/pabloRom2004/inferencebench-eval
